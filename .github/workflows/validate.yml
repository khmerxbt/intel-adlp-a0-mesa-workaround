name: Source and documentation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Unit checks
        run: python3 -m unittest discover -s tests -v
      - name: Package checks
        run: python3 scripts/validate_package.py
      - name: Verify pinned Mesa archive and ordered patch application
        run: sh scripts/check-patches.sh
# This workflow submits no GPU work and does not claim hardware validation.
