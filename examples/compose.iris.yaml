# 64-bit compatible Iris app overlay; merge with the existing application stack.
services:
  gpu-app:
    image: ${GPU_APP_IMAGE:?Set a compatible application image}
    environment:
      LD_LIBRARY_PATH: /opt/qy0z-mesa/lib/x86_64-linux-gnu
      LIBGL_DRIVERS_PATH: /opt/qy0z-mesa/lib/x86_64-linux-gnu/dri
      __EGL_VENDOR_LIBRARY_FILENAMES: /opt/qy0z-mesa/share/glvnd/egl_vendor.d/50_mesa.json
      MESA_LOADER_DRIVER_OVERRIDE: iris
    devices:
      - ${DRI_RENDER_NODE:-/dev/dri/renderD128}:/dev/dri/renderD128
    volumes:
      - ${QY0Z_RUNTIME:?Set absolute staged runtime path}:/opt/qy0z-mesa:ro
